<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Recipe • RecipeVault</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            🍳 RecipeVault
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="add-recipe.html">Add Recipe</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <p class="eyebrow">RECIPEVAULT</p>

            <h1>Add a recipe.</h1>

            <p class="hero-description">
                Save a recipe so you can easily find it again later.
            </p>
        </section>

        <section class="section">

            <form id="recipeForm">

                <div class="form-group">
                    <label for="recipeName">Recipe Name</label>
                    <input
                        type="text"
                        id="recipeName"
                        placeholder="Chocolate Chip Cookies"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="A short description of the recipe..."
                    ></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="category">Category</label>

                        <select id="category" required>
                            <option value="">Choose a category</option>
                            <option value="Cookies">Cookies</option>
                            <option value="Cakes">Cakes</option>
                            <option value="Bread">Bread</option>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Desserts">Desserts</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="servings">Servings</label>

                        <input
                            type="number"
                            id="servings"
                            min="1"
                            placeholder="24"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="prepTime">Prep Time (minutes)</label>

                        <input
                            type="number"
                            id="prepTime"
                            min="0"
                            placeholder="15"
                        >
                    </div>

                    <div class="form-group">
                        <label for="cookTime">Cook Time (minutes)</label>

                        <input
                            type="number"
                            id="cookTime"
                            min="0"
                            placeholder="10"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label>Ingredients</label>

                    <div id="ingredients">
                        <div class="ingredient-row">
                            <input
                                type="number"
                                class="ingredient-amount"
                                placeholder="2"
                                step="any"
                            >

                            <select class="ingredient-unit">
    <option value="">Unit</option>

    <optgroup label="Volume">
        <option value="tsp">tsp</option>
        <option value="tbsp">tbsp</option>
        <option value="cup">cup</option>
        <option value="fl oz">fl oz</option>
        <option value="pint">pint</option>
        <option value="quart">quart</option>
        <option value="gallon">gallon</option>
        <option value="mL">mL</option>
        <option value="L">L</option>
    </optgroup>

    <optgroup label="Weight">
        <option value="oz">oz</option>
        <option value="lb">lb</option>
        <option value="g">g</option>
        <option value="kg">kg</option>
    </optgroup>

    <optgroup label="Other">
        <option value="whole">whole</option>
        <option value="pinch">pinch</option>
        <option value="dash">dash</option>
        <option value="package">package</option>
        <option value="can">can</option>
        <option value="jar">jar</option>
        <option value="bunch">bunch</option>
        <option value="slice">slice</option>
    </optgroup>

    <option value="custom">Custom...</option>
</select>

<input
    type="text"
    class="ingredient-custom-unit"
    placeholder="Custom unit"
    hidden
>

                            <input
                                type="text"
                                class="ingredient-name"
                                placeholder="flour"
                            >
                        </div>
                    </div>

                    <button
                        type="button"
                        id="addIngredient"
                        class="secondary-button"
                    >
                        + Add Ingredient
                    </button>
                </div>

                <div class="form-group">
                    <label>Instructions</label>

                    <div id="instructions">

                        <div class="instruction-row">
                            <span>1</span>

                            <textarea
                                class="instruction"
                                placeholder="Preheat the oven..."
                                required
                            ></textarea>
                        </div>

                    </div>

                    <button
                        type="button"
                        id="addInstruction"
                        class="secondary-button"
                    >
                        + Add Step
                    </button>
                </div>

                <div class="form-group">
                    <label for="notes">Personal Notes</label>

                    <textarea
                        id="notes"
                        placeholder="Anything you want to remember about this recipe..."
                    ></textarea>
                </div>

                <button type="submit" class="primary-button">
    Generate Recipe
</button>

<div id="jsonResult" class="json-result" hidden>
    <div class="json-header">
        <h2>Generated Recipe</h2>

        <button
            type="button"
            id="copyJson"
            class="secondary-button"
        >
            📋 Copy JSON
        </button>
    </div>

    <textarea
        id="jsonOutput"
        readonly
        spellcheck="false"
    ></textarea>

    <p class="json-help">
        Copy this JSON and add it to your <code>recipes.json</code> file.
    </p>
</div>

            </form>

        </section>

    </main>

    <script src="js/add-recipe.js"></script>

</body>
</html>
